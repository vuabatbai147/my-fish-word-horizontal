<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
/* Language selector inside Settings */
.lang-choice{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.lang-choice .btn{min-width:92px}
@media(max-width:630px){.lang-choice .btn{min-width:72px;padding:6px 8px;font-size:11px}}

/* 2026 home visual refresh: gameplay and navigation hooks unchanged */
.home-ui .logo{filter:drop-shadow(0 9px 10px rgba(0,38,64,.28))}
.home-ui .side-btn{width:76px;min-height:68px;border-radius:18px;background:linear-gradient(155deg,rgba(25,113,153,.97),rgba(8,58,93,.98));border:2px solid #9de8ec;box-shadow:inset 0 2px 0 #ffffff38,0 6px 0 #073f65,0 9px 17px #001f3c66;font-size:12px;transition:transform .12s}
.home-ui .side-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #073f65}
.home-ui .side-btn svg{height:27px;width:27px;stroke:#e4fbff}
.home-ui .cta{background:linear-gradient(#ffd76c 0%,#ffab38 37%,#f47324 100%);border:3px solid #fff8d5;box-shadow:0 7px 0 #b94a14,0 13px 25px #073b5266;transition:transform .12s}
.home-ui .cta b{color:#fff;font-size:30px;text-shadow:0 3px 0 #b84b1b}
.home-ui .cta small{color:#fff9df;font-weight:900}
@media (orientation:landscape){.home-ui .logo{top:34px}.home-ui .side{top:26%;gap:13px;left:22px}.home-ui .cta{bottom:36px;right:133px;padding:12px 26px 12px 16px}}
</style></head><body>
<title>My Fish World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: one-screen game shell. Canvas scenes run full-bleed; chunky lagoon-blue panels and pressable buttons float above. */
:root{
  --abyss:#052a44; --deep:#0b3d5f; --panel:#0f4c74; --panel-hi:#176a9a;
  --line:#62d2f2; --foam:#f2fcff; --mist:#9fd3e8; --ink:#0b3550;
  --card:#eaf7fd; --card-edge:#9cc6da;
  --coral:#ff7a3c; --coral-lo:#c94a12;
  --kelp:#33c27a; --kelp-lo:#1a8550;
  --tide:#2a93d6; --tide-lo:#16609a;
  --sun:#ffc63a; --sun-lo:#d98a00; --pearl:#c88cff; --danger:#ff4d5e;
  --f-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--abyss);color:var(--foam);font-family:var(--f-body);font-weight:700;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
body{display:flex;align-items:center;justify-content:center;padding:0;margin:0}
#app{position:relative;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));max-width:1280px;max-height:720px;margin:0 auto;overflow:hidden;background:var(--abyss);box-shadow:0 0 0 1px rgba(98,210,242,.15)}
canvas.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.panel-screen{padding-top:64px;padding-bottom:84px;background:radial-gradient(120% 60% at 50% 0%,#0e5683 0%,var(--abyss) 70%)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 20px;-webkit-overflow-scrolling:touch}

/* Currency glyphs */
.coin{display:inline-block;width:1.05em;height:1.05em;border-radius:50%;vertical-align:-.18em;background:radial-gradient(circle at 35% 30%,#fff6b8,#ffc63a 45%,#e08a00);box-shadow:inset 0 0 0 .12em #f0a400}
.gem{display:inline-block;width:.8em;height:.8em;margin:0 .12em;vertical-align:-.06em;transform:rotate(45deg);border-radius:.15em;background:linear-gradient(135deg,#f6d8ff,#c88cff 45%,#7b3fe0)}
.cur{display:inline-flex;align-items:center;gap:.3em;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Buttons */
.btn{font-family:var(--f-display);font-weight:800;font-size:15px;line-height:1.1;border-radius:14px;padding:8px 14px;color:#fff;background:var(--coral);box-shadow:0 4px 0 var(--coral-lo),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .08s,box-shadow .08s;text-shadow:0 1px 0 rgba(0,0,0,.25);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--coral-lo),inset 0 2px 0 rgba(255,255,255,.35)}
.btn.green{background:var(--kelp);box-shadow:0 4px 0 var(--kelp-lo),inset 0 2px 0 rgba(255,255,255,.35)}
.btn.green:active:not(:disabled){box-shadow:0 1px 0 var(--kelp-lo)}
.btn.blue{background:var(--tide);box-shadow:0 4px 0 var(--tide-lo),inset 0 2px 0 rgba(255,255,255,.3)}
.btn.blue:active:not(:disabled){box-shadow:0 1px 0 var(--tide-lo)}
.btn.small{font-size:13px;padding:5px 10px;border-radius:11px}
.btn.wide{width:100%}
.btn:disabled{filter:grayscale(.75) brightness(.85);cursor:not-allowed}

/* HUD */
.hud{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 16px}
.avatar{position:relative;width:44px;height:44px;flex:none;border-radius:50%;background:radial-gradient(circle at 40% 35%,#8fe3ff,#1d7fb8);border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.25);display:grid;place-items:center;overflow:hidden}
.avatar img{width:120%;max-width:none}
.who{display:flex;flex-direction:column;gap:3px;min-width:0;background:rgba(5,42,68,.72);padding:4px 10px 6px 12px;margin-left:-16px;border-radius:0 12px 12px 0;z-index:-1}
.who b{font-family:var(--f-display);font-size:14px;line-height:1}
.xp{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--mist)}
.xp .bar{width:64px;height:7px;border-radius:9px;background:rgba(0,0,0,.4);overflow:hidden}
.xp .bar i{display:block;height:100%;background:linear-gradient(90deg,#5ff0a8,#33c27a);border-radius:9px}
.pills{margin-left:auto;display:flex;gap:6px}
.pill{background:rgba(5,42,68,.78);border:2px solid rgba(98,210,242,.35);border-radius:99px;padding:3px 10px 3px 6px;font-family:var(--f-display);font-size:15px;line-height:1.2}
.gear{width:34px;height:34px;border-radius:11px;background:rgba(5,42,68,.78);border:2px solid rgba(98,210,242,.35);display:grid;place-items:center;flex:none}
.gear svg{width:18px;height:18px}

/* Bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:16px 12px 10px;background:linear-gradient(rgba(3,25,42,0),rgba(3,25,42,.92) 40%)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:16px;background:rgba(15,76,116,.95);border:2px solid rgba(98,210,242,.3);font-size:11px;font-weight:800;line-height:1.1;box-shadow:0 3px 0 rgba(0,0,0,.3);position:relative}
.nav button.on{background:var(--card);color:var(--ink);border-color:#fff}
.nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-6px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--danger);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;border:2px solid #fff}

/* Home */
.home-ui{position:absolute;inset:0;pointer-events:none}
.home-ui>*{pointer-events:auto}
.logo{position:absolute;top:72px;left:0;right:0;margin:0;text-align:center;font-family:var(--f-display);font-weight:800;line-height:.82;letter-spacing:-.01em;color:#ffd84a;transform:rotate(-3deg);pointer-events:none;
  text-shadow:0 3px 0 #ff9d1c,3px 0 0 #0b4f86,-3px 0 0 #0b4f86,0 -3px 0 #0b4f86,0 6px 0 #0b4f86,3px 5px 0 #0b4f86,-3px 5px 0 #0b4f86,3px -3px 0 #0b4f86,-3px -3px 0 #0b4f86,0 10px 14px rgba(0,30,60,.4)}
.logo span{display:block;font-size:clamp(46px,14vw,66px)}
.logo span+span{color:#7ff0ff;text-shadow:0 3px 0 #2bb7e0,3px 0 0 #0b4f86,-3px 0 0 #0b4f86,0 -3px 0 #0b4f86,0 6px 0 #0b4f86,3px 5px 0 #0b4f86,-3px 5px 0 #0b4f86,3px -3px 0 #0b4f86,-3px -3px 0 #0b4f86,0 10px 14px rgba(0,30,60,.4);margin-left:1.2em}
.side{position:absolute;left:16px;top:42%;display:flex;flex-direction:column;gap:10px}
.side-btn{position:relative;width:62px;padding:6px 0 5px;border-radius:14px;background:rgba(5,42,68,.82);border:2px solid rgba(98,210,242,.4);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.side-btn svg{width:24px;height:24px;fill:none;stroke:#bdf1ff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cta{position:absolute;right:16px;bottom:104px;display:flex;align-items:center;gap:10px;padding:10px 22px 10px 12px;border-radius:999px;background:linear-gradient(#ffb03a,#ff7a1c);border:3px solid #fff3c8;box-shadow:0 6px 0 #b8480b,0 12px 24px rgba(0,0,0,.3);color:#fff;font-family:var(--f-display);text-align:left;animation:breathe 2.4s ease-in-out infinite}
.cta:active{transform:translateY(4px)!important;box-shadow:0 2px 0 #b8480b}
.cta img{width:58px;height:42px;object-fit:contain;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.cta b{display:block;font-size:28px;line-height:.95;text-shadow:0 2px 0 #c2510d}
.cta small{display:block;font-size:14px;opacity:.95}
@keyframes breathe{50%{transform:scale(1.04)}}

/* Section heads, tabs, cards */
.scr-head{display:flex;align-items:center;gap:10px;padding:4px 16px 8px}
.scr-head h2{margin:0;font-family:var(--f-display);font-size:23px;line-height:1.1;text-wrap:balance;flex:1;min-width:0}
.back{width:36px;height:36px;border-radius:12px;background:var(--card);color:var(--ink);display:grid;place-items:center;box-shadow:0 3px 0 var(--card-edge);flex:none}
.back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:6px 13px;border-radius:12px;background:var(--deep);color:var(--mist);font-weight:800;font-size:13px;border:2px solid rgba(98,210,242,.2)}
.tab.on{background:var(--card);color:var(--ink);border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.card{position:relative;background:var(--card);color:var(--ink);border-radius:16px;padding:7px 7px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 var(--card-edge);text-align:center;min-width:0}
button.card:active{transform:translateY(2px);box-shadow:0 1px 0 var(--card-edge)}
.card img{width:100%;max-width:120px;aspect-ratio:22/15;object-fit:contain}
.card .nm{font-size:12.5px;font-weight:800;line-height:1.15;text-wrap:balance}
.card .sub{font-size:11px;color:#4b7590;font-variant-numeric:tabular-nums}
.card .price{font-family:var(--f-display);font-size:15px;line-height:1.1}
.card.sold{opacity:.5}
.card.locked img{opacity:.9}
.rar{display:inline-block;font-size:9.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:99px;color:#fff;background:var(--rc,#7d97ab)}
.card .rar{position:absolute;top:6px;left:6px}
.stars{color:#ffc63a;letter-spacing:1px;font-size:12px;text-shadow:0 1px 0 #b87800}
.stars .off{color:#c4d6e0;text-shadow:none}
.note{font-size:12.5px;color:var(--mist);line-height:1.45;margin:0 0 10px}
.note b{color:var(--foam)}
.sec-title{font-family:var(--f-display);font-size:17px;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.sec-title:first-child{margin-top:2px}
.empty{background:rgba(5,42,68,.6);border:2px dashed rgba(98,210,242,.35);border-radius:16px;padding:16px;text-align:center;color:var(--mist);font-size:13px;line-height:1.5}
.empty .btns{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}

/* Rows (upgrades, shop) */
.row{display:flex;align-items:center;gap:12px;background:var(--card);color:var(--ink);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--card-edge);margin-bottom:10px}
.row .ico{width:52px;height:52px;flex:none;border-radius:14px;background:linear-gradient(#d6f1fb,#b3e1f3);display:grid;place-items:center;overflow:hidden}
.row .ico img{width:110%;max-width:none}
.row .ico svg{width:30px;height:30px;fill:none;stroke:#16609a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-family:var(--f-display);font-size:16px;line-height:1.15}
.row .txt span{display:block;font-size:12px;color:#4b7590;line-height:1.35}
.lv{display:flex;gap:3px;margin-top:4px}
.lv i{width:14px;height:6px;border-radius:3px;background:#c4d6e0}
.lv i.on{background:var(--kelp)}

/* Progress */
.prog{height:12px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden;border:2px solid rgba(255,255,255,.15)}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#5ff0a8,#33c27a)}
.collect-head{display:flex;align-items:center;gap:12px;background:rgba(5,42,68,.7);border:2px solid rgba(98,210,242,.3);border-radius:16px;padding:10px 12px;margin-bottom:12px}
.collect-head .txt{flex:1;min-width:0;font-size:13px}
.collect-head .txt div{display:flex;justify-content:space-between;margin-bottom:5px;font-variant-numeric:tabular-nums}

/* Tank */
.tank-wrap{flex:none;margin:0 16px;position:relative}
.tank-lid{height:12px;margin:0 6px;border-radius:8px 8px 2px 2px;background:linear-gradient(#3b4c5a,#1d2a35);box-shadow:inset 0 -3px 0 #8ff3ff,0 6px 14px rgba(143,243,255,.35)}
.tank-view{position:relative;height:clamp(120px,25vh,210px);border:6px solid #1d2a35;border-radius:6px 6px 14px 14px;overflow:hidden;background:#0f78a8;box-shadow:0 8px 0 #6b4428,0 14px 20px rgba(0,0,0,.35)}
.tank-view canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tank-bar{display:flex;align-items:center;gap:8px;padding:7px 16px 5px;flex:none}
.tank-bar .cap{flex:1;font-size:12px;color:var(--mist)}
.tank-bar .cap .prog{height:9px;margin-top:3px}
.arrange{position:relative;width:100%;min-height:39px;display:flex;align-items:center;gap:8px;background:rgba(5,42,68,.95);border:2px solid rgba(98,210,242,.5);border-radius:12px 12px 0 0;padding:5px 9px 5px 12px;font-size:12px;z-index:2;flex:none}
.arrange span{flex:1}
.units{position:absolute;top:6px;right:6px;font-size:9.5px;font-weight:900;padding:1px 6px;border-radius:99px;background:var(--ink);color:#fff}
.adbox{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 16px;margin-bottom:14px;border-radius:16px;background:repeating-linear-gradient(135deg,#0a2236 0 14px,#0c2a42 14px 28px);border:2px dashed rgba(255,255,255,.3);text-align:center}
.adbox b{font-family:var(--f-display);font-size:22px;letter-spacing:.08em;text-transform:uppercase}
.adbox span{font-size:12.5px;color:var(--mist);line-height:1.4;max-width:30ch}
.adbox .prog{width:100%}
.adbox small{font-size:12px;font-variant-numeric:tabular-nums}
.catch .adrow{margin-top:10px}
.fishrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.fishrow .card .acts{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;justify-content:center}

/* Tank expansion cards */
.tanks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{border-radius:16px;overflow:hidden;background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--card-edge);display:flex;flex-direction:column}
.tcard .pv{height:84px;position:relative}
.tcard .pv canvas{width:100%;height:100%;display:block}
.tcard .lock{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,30,48,.45)}
.tcard .lock svg{width:30px;height:30px;fill:#fff}
.tcard .bd{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px}
.tcard .bd b{font-family:var(--f-display);font-size:15px;line-height:1.1}
.tcard .bd span{font-size:11.5px;color:#4b7590}

/* Bản đồ câu cá */
.map-grid{display:grid;grid-template-columns:1fr;gap:12px}
.map-card{border-radius:16px;overflow:hidden;background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--card-edge)}
.map-art{height:85px;background:linear-gradient(to bottom,var(--map-sky) 0 57%,var(--map-water) 58%);display:flex;align-items:center;justify-content:space-around}
.map-art span{font-size:45px;filter:drop-shadow(0 3px 3px #18425b55)}
.map-art b{background:#062b48bb;color:#fff;padding:5px 10px;border-radius:20px;font-size:11px}
.map-info{padding:10px}.map-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.map-head strong{font:800 18px var(--f-display)}
.map-head span{font-size:12px;color:#346886}.map-info p{margin:4px 0 8px;font-size:12px;color:#53778b}
.map-fishes{display:flex;overflow-x:auto;gap:5px;margin-bottom:10px;padding:3px 0}
.map-fishes>div{flex:none;display:flex;flex-direction:column;align-items:center;min-width:43px}
.map-fishes img{width:48px;height:34px;object-fit:contain}.map-fishes small{font-size:10px;color:#3e718c}
.map-locked{filter:saturate(.45)}.map-locked .map-art{filter:grayscale(.5)}
/* Fishing */
.f-top{position:absolute;top:10px;left:16px;right:16px;display:flex;align-items:center;gap:6px;z-index:3;flex-wrap:wrap}
.f-top .pill{font-size:13px;padding:4px 10px;display:inline-flex;align-items:center;gap:5px}
.f-top .pill svg{width:16px;height:16px}
.f-top .spacer{flex:1}
.stamina{position:absolute;top:100px;left:50%;transform:translateX(-50%);width:min(70%,300px);display:flex;align-items:center;gap:6px;z-index:3}
.stamina img{width:44px;height:32px;object-fit:contain;flex:none}
.stamina .bar{flex:1;height:16px;border-radius:99px;background:rgba(5,30,48,.75);border:2px solid rgba(255,255,255,.6);overflow:hidden}
.stamina .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff8a3d,#ffd23f 40%,#5ff0a8);transition:width .08s linear}
.stamina small{position:absolute;top:100%;left:50px;font-size:10.5px;color:#fff;text-shadow:0 1px 2px #000;margin-top:2px}
.tension{position:absolute;right:22px;top:24%;z-index:3;display:flex;flex-direction:column;align-items:center;gap:6px}
.tbar{position:relative;width:24px;height:clamp(140px,28vh,220px);border-radius:14px;border:3px solid #fff;background:linear-gradient(to top,#2ecc71 0 60%,#ffd23f 60% 84%,#ff4d5e 84%);overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.tbar i{position:absolute;left:0;right:0;top:0;background:rgba(5,30,48,.86)}
.tbar .sweet{position:absolute;left:-2px;right:-2px;bottom:35%;height:40%;border-top:2px dashed rgba(255,255,255,.85);border-bottom:2px dashed rgba(255,255,255,.85)}
.tension label{font-size:11px;font-weight:900;background:rgba(5,42,68,.8);padding:2px 8px;border-radius:99px}
.f-msg{position:absolute;top:max(150px,21%);left:16px;right:16px;margin:0 auto;max-width:330px;z-index:3;text-align:center;font-family:var(--f-display);font-size:18px;line-height:1.2;padding:8px 14px;border-radius:14px;background:rgba(5,42,68,.75);border:2px solid rgba(98,210,242,.35);text-wrap:balance;transition:background .2s}
.f-msg.warn{background:rgba(160,30,40,.85);border-color:#ffb0b8}
.f-msg.good{background:rgba(20,110,60,.85);border-color:#a8ffd0}

<script>
'use strict';

/* ================== VI / EN client-side localisation ==================
 * UI text (including dynamically generated cards, popups and Firebase login forms)
 * is translated without changing game data or the save format.
 */
const LANGUAGE_STORAGE_KEY='my_fish_world_language';
let GAME_LANGUAGE=(()=>{try{return localStorage.getItem(LANGUAGE_STORAGE_KEY)==='en'?'en':'vi'}catch{return 'vi'}})();
// Translation catalogs now live outside HTML. Add/change phrases in both JSON files.
const I18N_CATALOGS={vi:Object.create(null),en:Object.create(null)};
let I18N_KEYS=[];
let I18N_READY=false;
const I18N_LOAD=Promise.all(['vi','en'].map(async lang=>{
 const response=await fetch(`./locales/${lang}.json`,{cache:'no-cache'});
 if(!response.ok)throw new Error(`Unable to load ${lang}.json (HTTP ${response.status})`);
 const phrases=await response.json();
 if(!phrases||typeof phrases!=='object'||Array.isArray(phrases))throw new Error(`Invalid ${lang}.json`);
 I18N_CATALOGS[lang]=phrases;
})).then(()=>{
 I18N_KEYS=Object.keys(I18N_CATALOGS.vi).filter(k=>k.length>=4).sort((a,b)=>b.length-a.length);
 I18N_READY=true;
 translateElementTree(document.body);
}).catch(error=>{

});
const I18N_NODE_ORIGINAL=new WeakMap();
const I18N_ATTRIBUTE_ORIGINAL=new WeakMap();
function getLanguage(){return GAME_LANGUAGE}
function translateText(original){
 if(!original||!I18N_READY)return original;
 // Original game source strings are Vietnamese; the VI catalog mirrors them.
 if(GAME_LANGUAGE==='vi'||!/[À-ỹ]/.test(original))return original;
 const catalog=I18N_CATALOGS[GAME_LANGUAGE];
 const trimmed=original.trim();
 if(Object.prototype.hasOwnProperty.call(catalog,trimmed))return original.replace(trimmed,catalog[trimmed]);
 let converted=original;
 for(const key of I18N_KEYS){
   if(converted.includes(key)&&Object.prototype.hasOwnProperty.call(catalog,key))converted=converted.split(key).join(catalog[key]);
 }
 return converted;
}
function translateElementTree(root){
 if(!root||root.nodeType!==1)return;
 const list=[root,...root.querySelectorAll('*')];
 for(const element of list){
  if(['SCRIPT','STYLE','TEXTAREA','OPTION','SVG','PATH','CANVAS'].includes(element.tagName))continue;
  for(const node of element.childNodes){
   if(node.nodeType!==3||!node.nodeValue.trim())continue;
   let track=I18N_NODE_ORIGINAL.get(node);
   if(!track||node.nodeValue!==track.rendered){track={original:node.nodeValue,rendered:node.nodeValue};}
   const translated=translateText(track.original);
   track.rendered=translated;I18N_NODE_ORIGINAL.set(node,track);
   if(node.nodeValue!==translated)node.nodeValue=translated;
  }
  for(const attr of ['title','placeholder','aria-label']){
   if(!element.hasAttribute(attr))continue;
   let items=I18N_ATTRIBUTE_ORIGINAL.get(element)||{};
   let track=items[attr];let value=element.getAttribute(attr);
   if(!track||value!==track.rendered)track={original:value,rendered:value};
   const translated=translateText(track.original);
   track.rendered=translated;items[attr]=track;I18N_ATTRIBUTE_ORIGINAL.set(element,items);
   if(value!==translated)element.setAttribute(attr,translated);
  }
 }
 document.documentElement.lang=GAME_LANGUAGE;
}
function setLanguage(lang){
 if(lang!=='en'&&lang!=='vi')return;
 GAME_LANGUAGE=lang;
 try{localStorage.setItem(LANGUAGE_STORAGE_KEY,lang)}catch(e){console.warn('Language preference not saved',e)}
 translateElementTree(document.body);
}
const I18N_OBSERVER=new MutationObserver(records=>{
 const changed=new Set();
 for(const r of records){
  if(r.type==='childList'){if(r.target.nodeType===1)changed.add(r.target);}
  else if(r.type==='characterData' && r.target.parentElement)changed.add(r.target.parentElement);
  else if(r.type==='attributes'&&r.target.nodeType===1)changed.add(r.target);
 }
 for(const element of changed)translateElementTree(element);
});
window.addEventListener('DOMContentLoaded',()=>translateElementTree(document.body));

function sfx(kind){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime;
    const tone=(f,dur,type='sine',vol=0.12,delay=0,f2)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t+delay);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+delay+dur);g.gain.setValueAtTime(0.0001,t+delay);g.gain.exponentialRampToValueAtTime(vol,t+delay+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+delay+dur);o.connect(g).connect(AC.destination);o.start(t+delay);o.stop(t+delay+dur+0.02)};
    const noise=(dur,vol=0.2,freq=900)=>{const b=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=freq;g.gain.value=vol;s.buffer=b;s.connect(f).connect(g).connect(AC.destination);s.start()};
    if(kind==='splash')noise(0.35,0.25,1200);
    else if(kind==='cast')tone(900,0.25,'sine',0.05,0,300);
    else if(kind==='bite'){tone(660,0.08,'square',0.06);tone(880,0.1,'square',0.06,0.1)}
    else if(kind==='tick')tone(1500,0.025,'square',0.025);
    else if(kind==='catch'){[523,659,784,1046].forEach((f,i)=>tone(f,0.18,'triangle',0.12,i*0.09))}
    else if(kind==='fail'){tone(400,0.4,'sawtooth',0.06,0,120)}
    else if(kind==='coin'){tone(1320,0.08,'square',0.05);tone(1760,0.15,'square',0.05,0.07)}
    else if(kind==='click')tone(700,0.05,'triangle',0.06);
    else if(kind==='level'){[392,523,659,784,1046].forEach((f,i)=>tone(f,0.2,'triangle',0.1,i*0.08))}
  }catch(e){}
}

/* ============ Fish drawing ============ */
const TAIL_LEN={fan:0.34,fork:0.3,veil:0.62,round:0.24,shark:0.36};
const DORSAL_TOP={normal:0.98,tall:1.3,sail:1.4,spiky:1.05,shark:1.15,long:0.95,none:0.5};
function bodyPath(c,L,H,round){
  c.beginPath();
  if(round){c.ellipse(0,0,L*0.5,H*0.5,0,0,TAU);return}
  c.moveTo(L*0.5,0);
  c.bezierCurveTo(L*0.47,-H*0.42,L*0.18,-H*0.56,-L*0.12,-H*0.48);
  c.quadraticCurveTo(-L*0.4,-H*0.34,-L*0.48,-H*0.1);
  c.lineTo(-L*0.48,H*0.1);
  c.quadraticCurveTo(-L*0.4,H*0.34,-L*0.12,H*0.48);
  c.bezierCurveTo(L*0.18,H*0.56,L*0.47,H*0.42,L*0.5,0);
  c.closePath();
}
function tailPath(c,type,L,H,t){
  const tl=L*TAIL_LEN[type];c.beginPath();
  if(type==='fan'){c.moveTo(L*0.03,-H*0.12);c.quadraticCurveTo(-tl*0.45,-H*0.55,-tl,-H*0.62);c.quadraticCurveTo(-tl*0.72,0,-tl,H*0.62);c.quadraticCurveTo(-tl*0.45,H*0.55,L*0.03,H*0.12)}
  else if(type==='fork'){c.moveTo(L*0.03,-H*0.1);c.quadraticCurveTo(-tl*0.5,-H*0.35,-tl,-H*0.72);c.quadraticCurveTo(-tl*0.62,-H*0.15,-tl*0.48,0);c.quadraticCurveTo(-tl*0.62,H*0.15,-tl,H*0.72);c.quadraticCurveTo(-tl*0.5,H*0.35,L*0.03,H*0.1)}
  else if(type==='veil'){const wv=Math.sin(t*4)*H*0.15;c.moveTo(L*0.03,-H*0.15);c.bezierCurveTo(-tl*0.3,-H*1.0,-tl*0.9,-H*1.05+wv,-tl,-H*0.3+wv);c.quadraticCurveTo(-tl*1.08,H*0.2+wv,-tl*0.95,H*0.72+wv);c.bezierCurveTo(-tl*0.7,H*1.05,-tl*0.25,H*0.9,L*0.03,H*0.15)}
  else if(type==='round'){c.moveTo(L*0.03,-H*0.12);c.bezierCurveTo(-tl*0.6,-H*0.62,-tl*1.15,-H*0.5,-tl,0);c.bezierCurveTo(-tl*1.15,H*0.5,-tl*0.6,H*0.62,L*0.03,H*0.12)}
  else {c.moveTo(L*0.03,-H*0.12);c.lineTo(-tl,-H*0.98);c.quadraticCurveTo(-tl*0.62,-H*0.2,-tl*0.6,0);c.lineTo(-tl*0.8,H*0.58);c.lineTo(L*0.03,H*0.16)}
  c.closePath();
}
function finFill(c,fin){c.fillStyle=fin;c.globalAlpha*=0.92;c.fill();c.globalAlpha/=0.92;c.stroke()}
function drawFins(c,sp,L,H,t,fin){
  const wv=Math.sin(t*3)*H*0.06;
  switch(sp.dorsal){
    case 'normal':c.beginPath();c.moveTo(L*0.14,-H*0.44);c.quadraticCurveTo(-L*0.02,-H*0.98,-L*0.24,-H*0.42);c.closePath();finFill(c,fin);break;

/* ============ UI helpers ============ */
function toast(html,cls=''){const el=document.createElement('div');el.className='toast '+cls;el.innerHTML=html;$('#toasts').appendChild(el);setTimeout(()=>el.classList.add('out'),2300);setTimeout(()=>el.remove(),2700);while($('#toasts').children.length>3)$('#toasts').firstChild.remove()}
let modalOnClose=null;
function openModal(html,onClose){
  $('#sheet').innerHTML=`<button class="x" data-close aria-label="Đóng"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="sheet-scroll">${html}</div>`;
  $('#modal').hidden=false;
  modalOnClose=onClose||null;
}
function closeModal(){if($('#modal').hidden)return;$('#modal').hidden=true;const f=modalOnClose;modalOnClose=null;if(f)f()}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('[data-close]'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

function spend(n,cur='coin'){const key=cur==='gem'?'gems':'coins';if(S[key]<n){toast(cur==='gem'?'Không đủ kim cương':'Không đủ xu','bad');sfx('fail');return false}S[key]-=n;dirty();renderHUD();return true}
function gain(c=0,g=0){S.coins+=c;S.gems+=g;dirty();renderHUD();if(c||g)sfx('coin')}
function addXP(n){S.xp+=n;let up=false;while(S.xp>=xpNeed(S.level)){S.xp-=xpNeed(S.level);S.level++;S.gems+=5;up=true;
  const un=LOCS.find(l=>l.lv===S.level);setTimeout(()=>{toast(`<b>Lên cấp ${S.level}!</b> Thưởng ${gemH(5)}`,'gold');if(un)toast(`Mở khóa điểm câu mới: <b>${un.name}</b>`,'gold');sfx('level')},400)}
  dirty();renderHUD();return up}
function track(k,n=1){let ch=false;S.quests.forEach(q=>{if(q.k===k&&q.p<q.n){q.p=Math.min(q.n,q.p+n);ch=true;if(q.p===q.n)toast(`Hoàn thành nhiệm vụ: <b>${q.text}</b>`,'gold')}});if(ch){dirty();renderBadges()}}
function discover(id,w){const d=S.disc[id]||(S.disc[id]={n:0,best:0});const rec=w>d.best&&d.n>0;d.n++;if(w>d.best)d.best=w;dirty();renderBadges();return rec}

function renderHUD(){
  $('#coinTxt').textContent=fmt(S.coins);$('#gemTxt').textContent=fmt(S.gems);
  $('#lvTxt').textContent='Lv.'+S.level;$('#xpBar').style.width=(S.xp/xpNeed(S.level)*100)+'%';
}
function renderBadges(){
  const q=S.quests.filter(q=>q.p>=q.n).length;$('#qBadge').hidden=!q;$('#qBadge').textContent=q;
  $('#mBadge').hidden=S.mailDay===todayKey();
  const found=ACTIVE.filter(s=>S.disc[s.id]).length;const next=MILESTONES[S.chests];$('#cBadge').hidden=!(next&&found>=next.n);
  const a=adState();$('#gBadge').hidden=!(a.g<GEM_AD_LIMIT&&a.n<AD_LIMIT);
}

}

function pines(c,w,y,seed,col){c.fillStyle=col;for(let i=0;i<12;i++){const x=((i*79+seed*43)%100)/100*w;const h=18+((i*19)%8)*3;for(let k=0;k<3;k++){const yy=y-h+k*8;c.beginPath();c.moveTo(x,yy);c.lineTo(x-h*(0.24+k*0.05),yy+12);c.lineTo(x+h*(0.24+k*0.05),yy+12);c.closePath();c.fill()}c.fillRect(x-1.5,y-h*0.15,3,h*0.24)}}

const F={phase:'idle',t:0,hold:false,ten:30,stam:100,slack:0,surge:0,nextSurge:2,sp:null,w:0,biteAt:3,castT:0,tick:0,msgCls:''};
const splashes=[],drops=[];
function weatherNow(){const k=Math.floor(Date.now()/600000);const r=(k*9301+49297)%233280/233280;const id=r<0.5?'sun':r<0.8?'cloud':'rain';return{id,temp:24+Math.floor(r*8),name:{sun:'Nắng',cloud:'Nhiều mây',rain:'Mưa'}[id]}}
const isNight=()=>{const h=new Date().getHours();return h>=18||h<6};
const WICONS={sun:'<svg viewBox="0 0 24 24" fill="none" stroke="#ffc63a" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="#ffc63a"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',cloud:'<svg viewBox="0 0 24 24" fill="#e6f4fb"><path d="M7 19a5 5 0 0 1-.5-10A6 6 0 0 1 18 9.5 4.8 4.8 0 0 1 17.5 19z"/></svg>',rain:'<svg viewBox="0 0 24 24" fill="#e6f4fb" stroke="#7fd3ff" stroke-width="2" stroke-linecap="round"><path stroke="none" d="M7 15a5 5 0 0 1-.5-10A6 6 0 0 1 18 5.5 4.8 4.8 0 0 1 17.5 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/></svg>'};
function setMsg(t,cls=''){const m=$('#fMsg');if(m.textContent!==t)m.textContent=t;if(F.msgCls!==cls){m.className='f-msg '+cls;F.msgCls=cls}}
function renderFishUI(){
  const L=LOC[S.loc]||LOC.ho;$('#fLocTxt').textContent=L.name;const W=weatherNow();$('#fWeather').innerHTML=WICONS[W.id]+W.name+' '+W.temp+'°';
  $('#rodTxt').textContent=RODS[S.rod].name;const b=BAIT[S.bait];$('#baitTxt').textContent=b.name+(b.id==='worm'?'':' ×'+S.baits[b.id]);
  $('#baitIco').innerHTML=`<svg viewBox="0 0 24 24" width="30" height="30"><circle cx="12" cy="12" r="11" fill="${b.color}" opacity=".25"/><path d="M6 14c2-5 6 1 8-3s4-2 4 0" fill="none" stroke="${b.color}" stroke-width="3.5" stroke-linecap="round"/></svg>`;
  updateFishTime();setReelBtn();
}
function updateFishTime(){const d=new Date();$('#fTime').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function setReelBtn(){const b=$('#reelBtn'),l=$('#reelLbl');b.classList.toggle('hot',F.phase==='bite');b.classList.toggle('wait',F.phase==='wait'||F.phase==='cast');
  l.textContent={idle:'Quăng câu',cast:'...',wait:'Chờ cá...',bite:'Giật cần!',reel:'Kéo cá',caught:'Kéo cá'}[F.phase]||'Quăng câu';
  $('#stamWrap').hidden=$('#tenWrap').hidden=F.phase!=='reel';$('#baitBtn').hidden=F.phase==='reel'}
function startFishing(){F.phase='idle';go('fish');setMsg('Chạm Quăng câu để bắt đầu')}
const DEV_CHEAT={nextFish:'',maxWeight:false,instant:false};
function rollFish(){
  if(DEV_MODE && DEV_CHEAT.nextFish && SP[DEV_CHEAT.nextFish]){
    const sp=SP[DEV_CHEAT.nextFish];DEV_CHEAT.nextFish='';
    return {sp,w:DEV_CHEAT.maxWeight?sp.w[1]:sp.w[0]+(sp.w[1]-sp.w[0])*0.85};
  }
  const L=LOC[S.loc]||LOC.ho;let pool=L.pool.map(id=>SP[id]).filter(sp=>!sp.goldOnly||S.bait==='gold');
  const cnt={};pool.forEach(sp=>cnt[sp.r]=(cnt[sp.r]||0)+1);const W=weatherNow();const m=BAIT[S.bait].mult;
  const ws=pool.map(sp=>RW[sp.r]/cnt[sp.r]*m[sp.r]*(W.id==='rain'&&sp.r>=2?1.3:1));
  let r=Math.random()*ws.reduce((a,b)=>a+b,0),sp=pool[0];for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0){sp=pool[i];break}}
  const w=DEV_MODE&&DEV_CHEAT.maxWeight?sp.w[1]:sp.w[0]+(sp.w[1]-sp.w[0])*Math.pow(Math.random(),1.5/Math.sqrt(RODS[S.rod].p));return{sp,w};
}
function reelAction(){
  if(F.phase==='idle'){
    if(S.bait!=='worm'&&!(S.baits[S.bait]>0)){S.bait='worm';renderFishUI()}
    F.phase='cast';F.castT=0;sfx('cast');setMsg('Quăng câu...');setReelBtn();
  }else if(F.phase==='wait'){F.phase='idle';setMsg('Giật sớm quá! Cá hoảng sợ bỏ đi.','warn');sfx('fail');setReelBtn()}
  else if(F.phase==='bite'){
    if(S.bait!=='worm'){S.baits[S.bait]=Math.max(0,(S.baits[S.bait]||0)-1);if(!S.baits[S.bait])S.bait='worm';dirty()}
    F.phase='reel';F.ten=35;F.stam=100;F.slack=0;F.surge=0;F.nextSurge=rand(0.8,1.6);F.t=0;
    $('#stamImg').src=fishIcon(F.sp.id,true);sfx('splash');burst(F.bx,F.by,14);setReelBtn();renderFishUI();
  }
}
function burst(x,y,n){for(let i=0;i<n;i++)drops.push({x,y,vx:rand(-90,90),vy:rand(-220,-80),life:1})}
function fishFail(kind){F.phase='idle';F.hold=false;$('#reelBtn').classList.remove('press');sfx('fail');setMsg(kind==='line'?'Đứt dây! Lần sau đừng kéo căng quá.':'Dây chùng quá lâu, cá đã sổng mất.','warn');setReelBtn()}
function fishCaught(){
  F.phase='caught';F.hold=false;$('#reelBtn').classList.remove('press');sfx('catch');setReelBtn();
  const fish=mkFish(F.sp.id,F.w);S.stats.caught++;const rec=discover(F.sp.id,F.w);
  const xp=10*F.sp.r*F.sp.r+fish.stars*3;addXP(xp);
  track('catch');if(F.sp.r>=2)track('catchRare');if(fish.stars===3)track('perfect');
  const bonus={c:5+F.sp.r*10,g:F.sp.r>=4?3:F.sp.r===3?1:0};gain(bonus.c,bonus.g);
  setTimeout(()=>showCatch(fish,rec,xp,bonus),350);

function updateFishing(dt){
  const {w,h}=fishDims;const sp=F.sp;
  if(F.phase==='cast'){F.castT+=dt;if(F.castT>=0.65){F.phase='wait';F.t=0;const r=rollFish();F.sp=r.sp;F.w=r.w;F.biteAt=rand(1.8,4.5)*BAIT[S.bait].speed;F.bx=w*0.42;F.by=h*0.6;sfx('splash');splashes.push({x:F.bx,y:F.by,r:3,life:1,cv:'fish'});burst(F.bx,F.by,8);setMsg('Đợi cá cắn câu...');setReelBtn()}}
  else if(F.phase==='wait'){F.t+=dt;if(F.t>=F.biteAt){F.phase='bite';F.t=0;sfx('bite');try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}setMsg('Cá cắn câu! Giật cần ngay!','good');setReelBtn()}}
  else if(F.phase==='bite'){F.t+=dt;if(Math.random()<dt*6)splashes.push({x:F.bx,y:F.by,r:2,life:0.8,cv:'fish'});if(F.t>1.35){F.phase='idle';setMsg('Chậm mất rồi, cá đã nhả mồi.','warn');sfx('fail');setReelBtn()}}
  else if(F.phase==='reel'){
    const f=clamp((F.w-sp.w[0])/(sp.w[1]-sp.w[0]),0,1);const str=STR[sp.r]*(0.85+0.3*f);
    if(F.hold)F.ten+=(26+16*str)*dt;else F.ten-=42*dt;

    else if(F.nextSurge<=0){F.surge=rand(0.4,0.9);F.nextSurge=rand(1.0,2.6)/Math.sqrt(str);sfx('splash');burst(F.fx||w/2,F.fy||h*0.7,10)}

    else if(F.slack>0.8)setMsg('Dây chùng rồi, kéo tiếp đi!','warn');
    else if(F.surge>0)setMsg('Cá đang vùng vẫy!','');
    else if(F.ten>=35&&F.ten<=75&&F.hold)setMsg('Tuyệt! Giữ nhịp này','good');

  }
}

/* ============ Market ============ */
let mTab='thuong';
function genOffers(tab){const pool=tab==='thuong'?ACTIVE.filter(s=>s.r===1):ACTIVE.filter(s=>s.r>=2);return shuffle(pool.map(s=>s.id)).slice(0,12).map(id=>({id,sold:false}))}
function ensureMarket(){
 if(!S.market)S.market={offers:{thuong:genOffers('thuong'),hiem:genOffers('hiem')},next:0};
 if(!S.market.offers)S.market.offers={};
 for(const tab of ['thuong','hiem']){
  const existing=Array.isArray(S.market.offers[tab])?S.market.offers[tab].filter(o=>o&&SP[o.id]):[];
  if(existing.length<12){
    const used=new Set(existing.map(o=>o.id));
    const more=genOffers(tab).filter(o=>!used.has(o.id));
    S.market.offers[tab]=[...existing,...more].slice(0,12);
    if(S.market.offers[tab].length<12){
      const pool=shuffle(ACTIVE.filter(sp=>tab==='thuong'?sp.r===1:sp.r>=2).map(sp=>sp.id).filter(id=>!S.market.offers[tab].some(o=>o.id===id)));
      S.market.offers[tab].push(...pool.slice(0,12-S.market.offers[tab].length).map(id=>({id,sold:false})));
    }
  }
 }
}
const mPrice=sp=>sp.r>=4?{n:30,cur:'gem'}:sp.r===3?{n:12,cur:'gem'}:{n:Math.round(sp.price*1.3/10)*10,cur:'coin'};

/* ============ Quests, mail, settings ============ */
function showQuests(){
  openModal(`<h3>Nhiệm vụ</h3><div class="list">`+S.quests.map((q,k)=>{const done=q.p>=q.n;return`<div class="qitem"><div class="top"><b>${q.text}</b>${done?`<button class="btn small green" data-qc="${k}">Nhận</button>`:''}</div>
    <div class="rw">Thưởng: ${coinH(q.c)} ${q.g?gemH(q.g):''}</div><div class="foot"><div class="prog"><i style="width:${q.p/q.n*100}%"></i></div><small>${q.p}/${q.n}</small></div></div>`}).join('')+`</div><p class="note" style="margin-top:12px">Nhận thưởng xong sẽ có nhiệm vụ mới ngay.</p>`);
  $$('[data-qc]').forEach(b=>b.onclick=()=>{const k=+b.dataset.qc,q=S.quests[k];gain(q.c,q.g);toast(`Nhận ${coinH(q.c)}${q.g?' và '+gemH(q.g):''}`,'gold');S.quests[k]=mkQuest(S.quests.map(x=>x.k));dirty();renderBadges();showQuests()});
}
function showMail(){
  const can=S.mailDay!==todayKey();
  openModal(`<h3>Hộp thư</h3><div class="list"><div class="qitem"><div class="top"><b>Quà mỗi ngày</b>${can?'<button class="btn small green" id="mClaim">Nhận</button>':'<span class="note" style="margin:0;color:#4b7590">Đã nhận hôm nay</span>'}</div><div class="rw">${coinH(300)} và 2 Tôm tươi. Quay lại vào ngày mai để nhận tiếp.</div></div>
   <div class="qitem"><div class="top"><b>Chào mừng tới My Fish World!</b></div><div class="rw" style="display:block;line-height:1.5">Mở bản đồ câu cá theo level để khám phá thêm loài quý hiếm. Giữ lại những con đẹp nhất cho bể và bán phần còn lại ở Chợ cá. Mỗi loài chiếm số chỗ khác nhau trong bể, nâng cấp bể để nuôi được nhiều hơn và mở khóa giao diện mới. Koi Hoàng Kim chỉ cắn Mồi vàng.</div></div></div>`);
  const b=$('#mClaim');if(b)b.onclick=()=>{S.mailDay=todayKey();S.baits.shrimp=(S.baits.shrimp||0)+2;gain(300);toast(`Nhận ${coinH(300)} và 2 Tôm tươi`,'gold');renderBadges();showMail()};
}
function showSettings(confirmReset=false){
  openModal(`<h3>Cài đặt</h3><div class="toggle"><span>Âm thanh</span><button class="sw ${S.sound?'on':''}" id="swSound" aria-label="Bật tắt âm thanh"></button></div>
   <div class="toggle"><span>🌐 Ngôn ngữ / Language</span><div class="lang-choice" role="group" aria-label="Language"><button class="btn small ${getLanguage()==='vi'?'green':'blue'}" type="button" id="langVi" aria-pressed="${getLanguage()==='vi'}">Tiếng Việt</button><button class="btn small ${getLanguage()==='en'?'green':'blue'}" type="button" id="langEn" aria-pressed="${getLanguage()==='en'}">English</button></div></div>
   <div class="stats"><div><small>Cá đã câu</small><b>${fmt(S.stats.caught)}</b></div><div><small>Cá đã bán</small><b>${fmt(S.stats.sold)}</b></div></div>
   <p class="note">Tiến trình (coin, cá, trang bị, bể) được lưu trong trình duyệt này.</p>
   ${confirmReset?`<p class="note" style="color:#ffb0b8">Toàn bộ cá, bể và tiền sẽ bị xóa. Bạn chắc chứ?</p><div class="btns2"><button class="btn blue" id="rsNo">Giữ lại</button><button class="btn" id="rsYes" style="background:var(--danger)">Xóa và chơi lại</button></div>`:`<button class="btn blue wide" id="rsAsk">Chơi lại từ đầu</button>`}`);
  $('#langVi').onclick=()=>{setLanguage('vi');showSettings(confirmReset)};
  $('#langEn').onclick=()=>{setLanguage('en');showSettings(confirmReset)};
  $('#swSound').onclick=()=>{S.sound=!S.sound;dirty();showSettings(confirmReset)};
  if(confirmReset){$('#rsNo').onclick=()=>showSettings(false);$('#rsYes').onclick=()=>{S=newState();save();ents.clear();closeModal();renderHUD();renderBadges();go('home');toast('Đã bắt đầu lại')}}else $('#rsAsk').onclick=()=>showSettings(true);
}
$('#questBtn').onclick=showQuests;$('#mailBtn').onclick=showMail;$('#gemAdBtn').onclick=gemAd;$('#gearBtn').onclick=()=>showSettings();
/* ============ DEV CHEAT PANEL (local testing only) ============ */
const DEV_BACKUP_KEY=SAVE_KEY+'_dev_backup';
function devApply(note){dirty();save();renderHUD();renderBadges();renderScreen();toast(note,'gold');showDevMenu()}
function devAddFish(id){
 const sp=SP[id];if(!sp)return false;
 const f=mkFish(id,DEV_CHEAT.maxWeight?sp.w[1]:(sp.w[0]+sp.w[1])/2);
 if(!S.disc[id])S.disc[id]={n:0,best:0};
 if(f.w>S.disc[id].best)S.disc[id].best=f.w;
 S.disc[id].n++;
 const dest=destFor(id);
 if(dest==='tank')S.tank.fish.push(f);
 else if(dest==='bag')S.bag.push(f);
 return !!dest;
}
function devInstantCatch(){
 if(screen!=='fish'){toast('Hãy vào màn câu cá trước','bad');return}
 if(F.phase==='caught'){toast('Hãy đóng kết quả câu trước','bad');return}
 if(!F.sp || F.phase==='idle' || F.phase==='cast'){const roll=rollFish();F.sp=roll.sp;F.w=roll.w}
 if(DEV_CHEAT.nextFish){const roll=rollFish();F.sp=roll.sp;F.w=roll.w}
 if(DEV_CHEAT.maxWeight)F.w=F.sp.w[1];
 fishCaught();closeModal();
}
function showDevMenu(){
 if(!DEV_MODE)return;
 const selected=DEV_CHEAT.nextFish;
 openModal(`<h3>🛠 DEV CHEAT MENU</h3><p class="dev-warning">Chỉ dùng để thử nghiệm. Các thay đổi tiền, level, cá, vật phẩm được lưu vào tiến trình hiện tại.</p>
 <div class="dev-section">💰 Tài nguyên</div><div class="dev-menu-grid"><button class="btn green" data-cheat="coins">+100.000 vàng</button><button class="btn green" data-cheat="gems">+1.000 kim cương</button><button class="btn blue" data-cheat="baits">+100 mỗi loại mồi</button><button class="btn blue" data-cheat="rods">Mở tất cả cần câu</button></div>
 <div class="dev-section">🗺️ Level & bản đồ</div><input id="devLevel" class="dev-input" type="number" min="1" max="999" value="${S.level}" aria-label="Level mong muốn"><div class="dev-menu-grid"><button class="btn blue" data-cheat="setLevel">Đặt level</button><button class="btn green" data-cheat="nextLevel">+1 level</button><button class="btn green" data-cheat="allMaps">Mở 6 bản đồ (Lv.22)</button><button class="btn blue" data-cheat="maxLevel">Level 100</button></div>
 <div class="dev-section">🎣 Câu cá</div><p class="note">Chọn cá cho lần câu tiếp theo (có thể chọn cả cá ngoài bản đồ hiện tại).</p><select id="devFish" class="dev-input"><option value="">Ngẫu nhiên theo bản đồ</option>${ACTIVE.map(sp=>`<option value="${sp.id}" ${selected===sp.id?'selected':''}>${sp.name} · ${RAR[sp.r].n}</option>`).join('')}</select>
 <div class="dev-menu-grid"><button class="btn blue" data-cheat="nextFish">Đặt cá câu tiếp</button><button class="btn green" data-cheat="instant">Bắt cá ngay</button><button class="btn blue" data-cheat="maxWeight">Cân nặng tối đa: ${DEV_CHEAT.maxWeight?'BẬT':'TẮT'}</button><button class="btn green" data-cheat="legendary">Cá Huyền thoại tiếp theo</button></div>
 <div class="dev-section">🐠 Bể cá & bộ sưu tập</div><div class="dev-menu-grid"><button class="btn blue" data-cheat="collection">Mở toàn bộ bộ sưu tập</button><button class="btn green" data-cheat="addFish">Thêm cá được chọn</button><button class="btn blue" data-cheat="tank">Bể tối đa</button><button class="btn green" data-cheat="decor">Mở đồ trang trí</button></div>
 <div class="dev-section">💾 Dữ liệu kiểm thử</div><div class="dev-menu-grid"><button class="btn blue" data-cheat="backup">Sao lưu dữ liệu</button><button class="btn blue" data-cheat="restore">Khôi phục bản sao</button><button class="btn" data-cheat="reset">Reset game</button><button class="btn blue" data-cheat="close">Đóng bảng</button></div>`);
 $$('#sheet [data-cheat]').forEach(btn=>btn.onclick=()=>{
  if(!DEV_MODE)return;
  const cmd=btn.dataset.cheat;
  if(cmd==='close'){closeModal();return}
  if(cmd==='instant'){devInstantCatch();return}
  if(cmd==='coins'){S.coins+=100000;devApply('Đã thêm 100.000 vàng');return}
  if(cmd==='gems'){S.gems+=1000;devApply('Đã thêm 1.000 kim cương');return}
  if(cmd==='baits'){S.baits.shrimp=(S.baits.shrimp||0)+100;S.baits.gold=(S.baits.gold||0)+100;devApply('Đã thêm 100 mồi mỗi loại');return}
  if(cmd==='rods'){S.rods=RODS.map((_,i)=>i);devApply('Đã mở tất cả cần câu');return}
  if(cmd==='setLevel'||cmd==='nextLevel'||cmd==='allMaps'||cmd==='maxLevel'){
   const value=cmd==='setLevel'?Number($('#devLevel').value):cmd==='nextLevel'?S.level+1:cmd==='allMaps'?Math.max(22,S.level):100;
   if(!Number.isInteger(value)||value<1||value>999){toast('Level phải từ 1 đến 999','bad');return}
   S.level=value;S.xp=0;if(S.level<LOC[S.loc].lv)S.loc='ho';devApply('Đã đặt Level '+value);return;
  }
  if(cmd==='nextFish'){DEV_CHEAT.nextFish=$('#devFish').value;toast(DEV_CHEAT.nextFish?'Đã chọn '+SP[DEV_CHEAT.nextFish].name:'Đã chuyển về cá ngẫu nhiên');showDevMenu();return}
  if(cmd==='legendary'){
   const legendary=ACTIVE.filter(sp=>sp.r===4 && (LOC[S.loc].pool.includes(sp.id)));
   const sp=legendary[0]||ACTIVE.find(sp=>sp.r===4);
   DEV_CHEAT.nextFish=sp.id;toast('Cá câu tiếp: '+sp.name,'gold');showDevMenu();return;
  }
  if(cmd==='maxWeight'){DEV_CHEAT.maxWeight=!DEV_CHEAT.maxWeight;showDevMenu();return}
  if(cmd==='collection'){ACTIVE.forEach(sp=>{if(!S.disc[sp.id])S.disc[sp.id]={n:1,best:sp.w[0]}});devApply('Đã mở toàn bộ bộ sưu tập');return}
  if(cmd==='addFish'){const id=$('#devFish').value;if(!id){toast('Hãy chọn một loài cá','bad');return}if(!devAddFish(id)){toast('Bể và giỏ đều hết chỗ','bad');return}devApply('Đã thêm '+SP[id].name);return}
  if(cmd==='tank'){S.tank.lv=TANK_MAX;S.tank.theme=THEMES.length-1;devApply('Bể cá đã lên cấp tối đa');return}
  if(cmd==='decor'){DECOR.forEach(d=>{if(!S.decorInv.some(item=>item.id===d.id))S.decorInv.push({u:uid(),id:d.id})});devApply('Đã mở mọi đồ trang trí');return}
  if(cmd==='backup'){save();try{localStorage.setItem(DEV_BACKUP_KEY,JSON.stringify(S));toast('Đã sao lưu vào trình duyệt','gold')}catch(e){toast('Không thể sao lưu','bad')}return}
  if(cmd==='restore'){
   const raw=localStorage.getItem(DEV_BACKUP_KEY);if(!raw){toast('Chưa có bản sao lưu','bad');return}
   if(!confirm('Khôi phục bản sao lưu? Tiến trình hiện tại sẽ bị thay thế.'))return;
   try{const obj=JSON.parse(raw);if(obj.v!==2||!obj.tank||!Array.isArray(obj.bag))throw Error('invalid');S=obj;if(!LOC[S.loc]||S.level<LOC[S.loc].lv)S.loc='ho';F.phase='idle';ents.clear();devApply('Đã khôi phục bản sao lưu')}catch(e){toast('Dữ liệu sao lưu không hợp lệ','bad')}return;
  }
  if(cmd==='reset'){
   if(!confirm('Xóa tiến trình hiện tại và chơi lại từ đầu? Hãy sao lưu trước!'))return;
   S=newState();F.phase='idle';ents.clear();save();closeModal();renderHUD();renderBadges();go('home');toast('Đã reset game');return;
  }
 });
}
$('#devBtn').hidden=true;
$('#devBtn').onclick=showDevMenu;
function showFishingMaps(){
 const cards=LOCS.map(L=>{const unlocked=S.level>=L.lv,chosen=S.loc===L.id;
 return `<div class="map-card ${unlocked?'':'map-locked'}" style="--map-sky:${L.sky[0]};--map-water:${L.water[0]}"><div class="map-art"><span>${L.emoji}</span><b>${unlocked?(chosen?'✓ Đang chọn':'Đã mở khóa'):'🔒 Level '+L.lv}</b></div><div class="map-info"><div class="map-head"><strong>${L.name}</strong><span>Lv.${L.lv}+</span></div><p>${L.desc}</p><div class="map-fishes">${L.pool.map(id=>`<div title="${SP[id].name} · ${fmt(SP[id].price)} xu"><img src="${fishIcon(id)}" alt="${SP[id].name}"><small>${fmt(SP[id].price)}</small></div>`).join('')}</div><button class="btn ${chosen?'green':'blue'} wide" data-map="${L.id}" ${unlocked?'':'disabled'}>${unlocked?(chosen?'Câu tại đây':'Chọn bản đồ'):'Cần Level '+L.lv}</button></div></div>`}).join('');
 openModal(`<h3>🗺️ Bản đồ câu cá</h3><p class="note">Cấp hiện tại: <b>Lv.${S.level}</b>. Mỗi bản đồ có các loài cá riêng. Bản đồ cấp cao có cá đắt và hiếm hơn. Giá dưới cá là giá cơ bản. Chọn xong sẽ vào câu ngay ở giao diện ngang.</p><div class="map-grid">${cards}</div>`);
 $$('[data-map]').forEach(b=>b.onclick=()=>{const L=LOC[b.dataset.map];if(!L||S.level<L.lv)return;S.loc=L.id;dirty();closeModal();sfx('click');startFishing();toast('Đã đến '+L.name,'gold')});
}
$('#startBtn').onclick=()=>{sfx('click');showFishingMaps()};
$('#fLoc').style.cursor='pointer';$('#fLoc').onclick=()=>{if(F.phase==='idle')showFishingMaps();else toast('Hãy hoàn thành lượt câu trước khi đổi bản đồ')};

/* ============ Loop ============ */
let T=0,last=performance.now(),secT=0;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;T+=dt;
  try{
    if(screen==='home')renderHome(dt);
    else if(screen==='fish'){updateFishing(dt);renderFishing(dt)}
    else if(screen==='tank')renderTank(dt);
  }catch(err){console.error(err)}
  secT+=dt;if(secT>=1){secT=0;if(screen==='market')updateRefresh();if(screen==='fish')updateFishTime()}
  if(saveT>0){saveT-=dt;if(saveT<=0)save()}
  requestAnimationFrame(loop);
}
$('#avatarImg').src=fishIcon('vang');$('#ctaImg').src=fishIcon('koi');
renderHUD();renderBadges();go('home');
if(!S.welcome){S.welcome=true;dirty();setTimeout(()=>toast('Chào mừng! Bấm <b>Bắt đầu</b> để câu con cá đầu tiên.','gold'),600)}
window.addEventListener('pagehide',save);
requestAnimationFrame(loop);
// Firebase bridge: cloud layer never has to rewrite the game engine.
window.fishBridge={
 setDevMode,
 getState:()=>S,
 newGame:()=>newState(),
 setSaveEnabled:enabled=>{accountSaveEnabled=!!enabled;saveT=0},
 applyState:state=>{
  if(!state||state.v!==2||!state.tank||!Array.isArray(state.tank.fish)||!Array.isArray(state.bag))throw Error('Save không hợp lệ');
  S=state;
  if(!LOC[S.loc]||S.level<LOC[S.loc].lv)S.loc='ho';
  if(!Array.isArray(S.rods))S.rods=[0];
  if(!S.rods.includes(S.rod))S.rod=0;
  F.phase='idle';F.hold=false;ents.clear();
  closeModal();renderHUD();renderBadges();go('home');
 }
};
</script>
